<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IndiHome by Telkomsel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
<h1>IndiHome by Telkomsel</h1>
<p>Internet cepat dan stabil untuk rumah Anda</p>
<a class="btn" href="#paket">Lihat Paket</a>
</header>

<section id="paket">
<h2>Paket Internet</h2>
<div class="cards">
<div class="card"><h3>50 Mbps</h3><p>Rp230.000</p></div>
<div class="card"><h3>75 Mbps</h3><p>Rp250.000</p></div>
<div class="card"><h3>150 Mbps</h3><p>Rp325.000</p></div>
<div class="card"><h3>200 Mbps</h3><p>Rp490.000</p></div>
</div>
</section>

<section>
<h2>Daftar Sekarang</h2>
<form onsubmit="kirimWA();return false;">
<input id="nama" placeholder="Nama" required>
<input id="alamat" placeholder="Alamat" required>
<button type="submit">Kirim ke WhatsApp</button>
</form>
</section>

<script src="script.js"></script>
</body>
</html>
